# Engine families and layouts
acf.descs.engines.inline=Cylinders in a row: simple, long and narrow. Petrol revs high, diesel pulls hard and runs lean.
acf.descs.engines.v=Two banks of cylinders: shorter than an inline of the same count, and the many-cylinder V's rev the highest of any piston engine.
acf.descs.engines.flat=Horizontally opposed banks: low and wide, and light for their size.
acf.descs.engines.radial=Air-cooled aero engines: the lightest piston engines per litre, but slow-revving and bulky.
acf.descs.engines.rotary=Wankel engines: small, smooth and high-revving, short of torque and thirsty.
acf.descs.engines.turbine=Free-turbine gas turbines: the lightest engines per kilowatt, with a wide powerband but poor throttle response and fuel economy. A geared output trades revs for torque, as in a tank install.
acf.descs.engines.electric=Heavy industrial motors: huge torque from a standstill, run backwards on negative throttle, and recharge their batteries on regen.
